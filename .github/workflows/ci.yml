name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ master, main, "feature/*" ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t minicodevelopers-app:${{ github.sha }} .

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'minicodevelopers-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
